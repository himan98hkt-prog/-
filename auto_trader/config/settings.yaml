universe:
  mode: watchlist            # watchlist | volume_rank
  # 업종을 흩어 둔다 — 한 업종이 무너질 때 전부 같이 가지 않게.
  # 종목 수가 늘면 AI 비용도 정비례로 는다(아래 max_candidates_per_cycle 과 함께 조절).
  watchlist:
    - "005930"   # 삼성전자          반도체
    - "000660"   # SK하이닉스        반도체
    - "005380"   # 현대차            자동차
    - "005490"   # POSCO홀딩스       철강
    - "051910"   # LG화학            화학·2차전지
    - "207940"   # 삼성바이오로직스  바이오
    - "105560"   # KB금융            금융
    - "015760"   # 한국전력          유틸리티
    - "035420"   # NAVER             인터넷
    - "012330"   # 현대모비스        자동차부품
  # 종목코드 → 종목명. 모의투자(VTS) 시세는 종목명을 비워 보낼 때가 있어,
  # 이게 없으면 화면·알림이 전부 "005930" 처럼 숫자로만 보인다.
  # 감시 종목을 바꾸면 여기도 같이 적어 주세요(안 적으면 코드로 표시됩니다).
  names:
    "005930": 삼성전자
    "000660": SK하이닉스
    "005380": 현대차
    "005490": POSCO홀딩스
    "051910": LG화학
    "207940": 삼성바이오로직스
    "105560": KB금융
    "015760": 한국전력
    "035420": NAVER
    "012330": 현대모비스
  # 종목이 어느 테마에 속하는지. 테마별 성과를 묶어 보여줄 때 쓴다 —
  # 한 테마가 통째로 밀리면 개별 종목 문제가 아니라 업황 문제다.
  # 적지 않은 종목은 '기타' 로 묶인다.
  themes:
    "005930": 반도체
    "000660": 반도체
    "005380": 자동차
    "012330": 자동차
    "005490": 철강
    "051910": 화학·2차전지
    "207940": 바이오
    "105560": 금융
    "015760": 유틸리티
    "035420": 인터넷
  volume_rank_top_n: 20      # volume_rank 모드일 때 거래량 상위 N개
  exclude_keywords: ["스팩", "우", "ETN", "ETF"]   # 종목명 기준 제외
  min_price: 1000            # 동전주 제외
  max_candidates_per_cycle: 10   # AI 호출 비용 제어

schedule:
  universe_refresh: "08:30"
  first_cycle: "09:05"
  # 사이클 주기(분). 09:05 부터 이 간격으로 15:00 까지 돈다.
  #   60분 → 하루 약 7회 / 15분 → 하루 약 26회 / 10분 → 약 39회
  #
  # 15분으로 내린 이유: 주기를 묶고 있던 제약이 사라졌다.
  # 1) Gemini 무료 등급 하루 20회 한도가 더 이상 묶지 않는다 — ai.engines 가
  #    Claude 단독이라 Gemini 를 아예 호출하지 않는다.
  # 2) Claude Max 구독에 월 $100 API 크레딧이 포함된다. 실측 토큰으로 15분
  #    주기 + Opus 5.5 가 월 $41 수준이고, 프롬프트 캐싱을 켜면 더 내려간다.
  #    크레딧은 매달 소멸하므로 아껴도 남지 않는다.
  # 3) 교차검증을 맡은 규칙 엔진은 API 를 쓰지 않아 호출 비용이 0이다.
  #
  # 판단 대상이 3~10거래일 스윙인 것은 그대로다. 주기를 줄여 얻는 것은 더 나은
  # '진입 시점' 이지, 더 많은 매매가 아니다 — 매수 조건은 그대로 엄격하다.
  # 급락 감시는 이 주기와 무관하게 risk.guard_interval_min(3분) 으로 돈다.
  cycle_interval_min: 15
  last_new_buy: "14:30"      # 이후 신규 매수 금지
  eod_review: "15:10"        # 장 마감 전 최종 점검 (손절/청산 판단)
  daily_report: "15:40"

risk:
  # 프로그램이 운용할 최대 총액. **계좌 잔고가 아니라 여기 적은 금액까지만** 굴린다.
  # 이 값을 넘는 돈은 프로그램이 쳐다보지도 않는다(대시보드 '자금 배치' 에서
  # '한도 밖' 으로 표시된다). 계좌 전체를 맡기려면 계좌 잔고와 같게 둔다.
  total_investment_cap_krw: 10000000
  max_position_pct: 20                # 종목당 최대 비중 (총액 대비 %)
  max_positions: 5                    # 동시 보유 종목 수
  daily_loss_limit_pct: 3             # 당일 실현+평가 손실 -3% 도달 시 신규 매수 중단
  stop_loss_pct: -5                   # 종목별 손절선 (AI 판단과 무관하게 강제)
  take_profit_pct: 10                 # 익절선 (도달 시 AI에 재판단 요청, 미응답 시 절반 매도)
  # 트레일링 스톱 — 익절선에서 기계적으로 자르지 않고 고점을 따라 올라간다.
  # +10%에 도달하면 켜지고, 이후 고점 대비 5% 밀리면 전량 매도한다.
  # 켜진 뒤에는 익절선 아래로 내려가지 않으므로 최소 +10%는 지킨다.
  # trailing_stop_pct: 0 으로 두면 기능이 꺼진다.
  trailing_activate_pct: 10
  trailing_stop_pct: 5
  # 산 당일에는 자발적 매도를 막는다 — 하루 회전은 왕복 비용만 내고 남는 게 없다.
  # 손절·트레일링은 이 제한을 받지 않는다(자산을 지키는 쪽은 언제나 통과).
  min_holding_days: 1
  min_order_krw: 100000               # 최소 주문 금액
  # 매수는 지정가로 낸다 — 급변 시 나쁜 가격에 체결되는 것을 막는다.
  # 미체결이면 30초 뒤 취소하고 다음 사이클로 넘긴다.
  # 매도는 이 설정과 무관하게 언제나 시장가다(나가는 쪽은 가격보다 나가는 것이 먼저).
  order_type: limit                   # market | limit
  limit_slippage_pct: 0.3             # limit일 때 현재가 대비 허용 범위
  guard_interval_min: 3               # 손절 감시 주기(분). 사이클 사이 급락을 잡는다

ai:
  # 판단에 참여할 엔진 명단. 여기 없는 엔진은 **객체조차 만들지 않는다** —
  # 호출이 없으므로 .env 에 키가 없어도 기동되고, 요금도 발생하지 않는다.
  #
  # Claude 단독인 이유: 교차검증을 유료 LLM 대신 규칙 엔진(아래 rules:)이 맡는다.
  # LLM 여럿의 합의는 생각보다 약한 검증이다 — 모델들은 같은 종류의 입력을 받고
  # 같은 편향(최근성, 설득력 있는 서술, 강세 쏠림)을 공유해서 오류가 서로
  # 상관되어 있다. 셋이 동의하고 셋이 같이 틀릴 수 있다. 반대로 만장일치 요구는
  # 매수 기회를 극단적으로 깎아냈다. 규칙 엔진은 틀리는 방식이 달라 실제로
  # 걸러내고, API 를 쓰지 않아 쿼터·인증 장애로 매매를 멈추지 않는다.
  #
  # 다시 늘리고 싶으면 ["claude", "gemini"] 처럼 적고 해당 키를 .env 에 넣으세요.
  # 고를 수 있는 값: claude / gemini / chatgpt
  engines: ["claude"]

  # 월 API 크레딧(USD) — 대시보드가 이번 달 사용액을 이 값 대비로 보여준다.
  # Claude Max 구독에 포함된 금액이 기본값이다. Ultra 면 200 으로 바꾸세요.
  # 크레딧은 결제주기마다 갱신되고 쓰지 않으면 소멸한다(이월 없음).
  monthly_credit_usd: 100

  timeout_sec: 60
  max_retries: 2
  min_confidence: 0.6                 # STRONG_BUY 로 인정할 최소 confidence
  # 후보를 한꺼번에 주고 **서로 비교**하게 한다(상대평가).
  # 종목을 하나씩 물으면 "이거 살 만한가" 라는 절대평가가 되고, 그 기준선은 높아
  # 대부분의 날은 아무도 못 넘어 답이 관망으로 쏠린다. 실제 자금은 "이 중 어디에"
  # 로 배분되므로 후보를 함께 보여준다. false 면 예전처럼 종목별로 따로 묻는다.
  compare_candidates: true
  max_buy_picks: 3                    # 한 번에 매수 제안을 줄 수 있는 상한
  batch_timeout_sec: 180              # 후보 전부를 한 번에 볼 때의 대기 한도(초)
  news_max_items: 5
  news_lookback_hours: 24
  # 모델별 100만 토큰당 단가 [입력, 출력] USD — 대시보드 비용 추정에 쓰인다.
  # 비워두면 내장 기본표를 쓰고, 표에 없는 모델은 비용 0으로 기록된다.
  # 정확한 단가는 각 제공사 요금 페이지에서 확인해 여기에 적으세요.
  # 여기 적은 모델만 덮어쓴다. 적지 않은 모델은 내장 기본표를 그대로 쓴다.
  pricing:
    # Claude 5.5 세대 (2026-11 확인)
    claude-opus-5-5: [4.0, 20.0]
    claude-sonnet-5-5: [2.0, 10.0]
    claude-haiku-5-5: [0.1, 0.5]
    # 이전 세대 — 모델을 되돌릴 때를 위해 남겨 둔다
    claude-opus-5: [5.0, 25.0]
    claude-sonnet-5: [2.0, 10.0]
    claude-haiku-4-5: [1.0, 5.0]
    # 기본 구성(engines: ["claude"])에서는 호출되지 않는다. 명단에 다시
    # 넣을 때를 위해 단가만 남겨 둔다.
    gemini-3.1-pro-preview: [1.25, 10.0]
    gemini-3.5-flash: [0.3, 2.5]
    gpt-5.1: [0.63, 5.0]

# --------------------------------------------------------------------------- #
# 규칙 엔진 — AI 판단을 교차검증하는 결정론적 정량 게이트 (API 호출 없음)
#
# 두 층으로 돈다.
#   거부권: 하나라도 걸리면 매수 금지. 점수로 상쇄되지 않는다.
#   점수  : 추세·모멘텀·거래량이 우호적인지 센다. 임계치를 넘으면 BUY/SELL.
#
# 규칙은 단독으로 **매수하지 못한다**(AI 동의 필수). 단독으로 **매도할 수는
# 있다** — 보호 동작이 LLM 가용성에 묶이면, 키가 거부된 날 손실을 안고 있게 된다.
# --------------------------------------------------------------------------- #
rules:
  enabled: true

  # --- 거부권 ------------------------------------------------------------ #
  rsi_overbought: 75        # RSI 가 이 이상이면 과열 → 매수 금지
  max_chase_pct: 8          # 당일 상승률이 이 % 이상이면 추격매수 금지
  max_spread_pct: 1.0       # 호가 스프레드가 이 % 이상이면 유동성 부족
  trend_break_pct: 5        # 60일선을 이 % 이상 밑돌면 장기추세 이탈
  block_above_band: true    # 볼린저 상단을 넘었으면 매수 금지

  # --- 매수 가점 (만점 5) ------------------------------------------------- #
  rsi_buy_low: 40           # 건강한 RSI 구간 하한
  rsi_buy_high: 65          # 건강한 RSI 구간 상한
  vol_surge: 1.2            # 거래량이 20일 평균의 이 배수 이상이면 가점
  buy_score_min: 3          # BUY 판정에 필요한 최소 가점

  # --- 매도 감점 (만점 3) ------------------------------------------------- #
  rsi_sell: 80              # 이 이상이면 단독으로 매도 신호
  sell_score_min: 2         # SELL 판정에 필요한 최소 감점
