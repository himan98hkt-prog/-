universe:
  mode: watchlist            # watchlist | volume_rank
  # 업종을 흩어 둔다 — 한 업종이 무너질 때 전부 같이 가지 않게.
  # 종목 수가 늘면 AI 비용도 정비례로 는다(아래 max_candidates_per_cycle 과 함께 조절).
  watchlist:
    - "005930"   # 삼성전자          반도체
    - "000660"   # SK하이닉스        반도체
    - "005380"   # 현대차            자동차
    - "005490"   # POSCO홀딩스       철강
    - "051910"   # LG화학            화학·2차전지
    - "207940"   # 삼성바이오로직스  바이오
    - "105560"   # KB금융            금융
    - "015760"   # 한국전력          유틸리티
    - "035420"   # NAVER             인터넷
    - "012330"   # 현대모비스        자동차부품
  # 종목이 어느 테마에 속하는지. 테마별 성과를 묶어 보여줄 때 쓴다 —
  # 한 테마가 통째로 밀리면 개별 종목 문제가 아니라 업황 문제다.
  # 적지 않은 종목은 '기타' 로 묶인다.
  themes:
    "005930": 반도체
    "000660": 반도체
    "005380": 자동차
    "012330": 자동차
    "005490": 철강
    "051910": 화학·2차전지
    "207940": 바이오
    "105560": 금융
    "015760": 유틸리티
    "035420": 인터넷
  volume_rank_top_n: 20      # volume_rank 모드일 때 거래량 상위 N개
  exclude_keywords: ["스팩", "우", "ETN", "ETF"]   # 종목명 기준 제외
  min_price: 1000            # 동전주 제외
  max_candidates_per_cycle: 10   # AI 호출 비용 제어

schedule:
  universe_refresh: "08:30"
  first_cycle: "09:05"
  cycle_interval_min: 30
  last_new_buy: "14:30"      # 이후 신규 매수 금지
  eod_review: "15:10"        # 장 마감 전 최종 점검 (손절/청산 판단)
  daily_report: "15:40"

risk:
  total_investment_cap_krw: 5000000   # 프로그램이 운용할 최대 총액
  max_position_pct: 20                # 종목당 최대 비중 (총액 대비 %)
  max_positions: 5                    # 동시 보유 종목 수
  daily_loss_limit_pct: 3             # 당일 실현+평가 손실 -3% 도달 시 신규 매수 중단
  stop_loss_pct: -5                   # 종목별 손절선 (AI 판단과 무관하게 강제)
  take_profit_pct: 10                 # 익절선 (도달 시 AI에 재판단 요청, 미응답 시 절반 매도)
  # 트레일링 스톱 — 익절선에서 기계적으로 자르지 않고 고점을 따라 올라간다.
  # +10%에 도달하면 켜지고, 이후 고점 대비 5% 밀리면 전량 매도한다.
  # 켜진 뒤에는 익절선 아래로 내려가지 않으므로 최소 +10%는 지킨다.
  # trailing_stop_pct: 0 으로 두면 기능이 꺼진다.
  trailing_activate_pct: 10
  trailing_stop_pct: 5
  # 산 당일에는 자발적 매도를 막는다 — 하루 회전은 왕복 비용만 내고 남는 게 없다.
  # 손절·트레일링은 이 제한을 받지 않는다(자산을 지키는 쪽은 언제나 통과).
  min_holding_days: 1
  min_order_krw: 100000               # 최소 주문 금액
  # 매수는 지정가로 낸다 — 급변 시 나쁜 가격에 체결되는 것을 막는다.
  # 미체결이면 30초 뒤 취소하고 다음 사이클로 넘긴다.
  # 매도는 이 설정과 무관하게 언제나 시장가다(나가는 쪽은 가격보다 나가는 것이 먼저).
  order_type: limit                   # market | limit
  limit_slippage_pct: 0.3             # limit일 때 현재가 대비 허용 범위
  guard_interval_min: 3               # 손절 감시 주기(분). 사이클 사이 급락을 잡는다

ai:
  timeout_sec: 60
  max_retries: 2
  min_confidence: 0.6                 # 두 AI 모두 이 값 이상이어야 STRONG_BUY 인정
  # 후보를 한꺼번에 주고 **서로 비교**하게 한다(상대평가).
  # 종목을 하나씩 물으면 "이거 살 만한가" 라는 절대평가가 되고, 그 기준선은 높아
  # 대부분의 날은 아무도 못 넘어 답이 관망으로 쏠린다. 실제 자금은 "이 중 어디에"
  # 로 배분되므로 후보를 함께 보여준다. false 면 예전처럼 종목별로 따로 묻는다.
  compare_candidates: true
  max_buy_picks: 3                    # 한 번에 매수 제안을 줄 수 있는 상한
  batch_timeout_sec: 180              # 후보 전부를 한 번에 볼 때의 대기 한도(초)
  news_max_items: 5
  news_lookback_hours: 24
  # 모델별 100만 토큰당 단가 [입력, 출력] USD — 대시보드 비용 추정에 쓰인다.
  # 비워두면 내장 기본표를 쓰고, 표에 없는 모델은 비용 0으로 기록된다.
  # 정확한 단가는 각 제공사 요금 페이지에서 확인해 여기에 적으세요.
  # 여기 적은 모델만 덮어쓴다. 적지 않은 모델은 내장 기본표를 그대로 쓴다.
  pricing:
    claude-opus-5: [5.0, 25.0]
    claude-sonnet-5: [2.0, 10.0]
    claude-haiku-4-5: [1.0, 5.0]
    gemini-3.1-pro-preview: [1.25, 10.0]
    gemini-3.5-flash: [0.3, 2.5]
    gpt-5.1: [0.63, 5.0]
