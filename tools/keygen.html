<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>학원 관리노트 — 라이선스 키 발급기 (판매자용)</title>
  <style>
    body { font: 15px/1.6 system-ui, -apple-system, "Noto Sans KR", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: #94a3b8; font-size: 13px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; margin-top: 16px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 10px 0 4px; }
    select, input, textarea, button { font: inherit; }
    select, input, textarea { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
    textarea { min-height: 190px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    button { padding: 10px 14px; border-radius: 9px; border: 0; background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer; }
    button.ghost { background: #334155; color: #e2e8f0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .keys { font-family: ui-monospace, Menlo, monospace; letter-spacing: .5px; }
    .ok { color: #4ade80; } .bad { color: #f87171; }
    code { background: #0f172a; padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>라이선스 키 발급기 <span class="muted">판매자 전용 — 고객에게 배포 금지</span></h1>
    <p class="muted">앱과 같은 모듈(<code>src/core/license.js</code>)을 그대로 import 하므로 발급한 키는 항상 앱에서 열립니다.
      <b>통합키(A로 시작)</b> 하나면 피아노 관리노트와 학원 관리노트 양쪽에서 사용할 수 있습니다
      (피아노 앱에도 같은 <code>license.js</code> 를 넣고 <code>PRODUCT_CODE</code> 만 <code>'K'</code> 로 바꾸면 됩니다).</p>

    <div class="card">
      <div class="row">
        <div style="flex:1">
          <label>제품 (첫 자리)</label>
          <select id="product">
            <option value="A">통합 A — 피아노 + 학원 관리노트 공용 (권장)</option>
            <option value="M">학원 관리노트 전용 M</option>
            <option value="K">피아노 관리노트 전용 K</option>
          </select>
        </div>
        <div style="flex:1">
          <label>플랜 (둘째 자리)</label>
          <select id="plan">
            <option value="lite">Lite (단일 기기·오프라인) — L</option>
            <option value="pro">Pro (멀티 기기·실시간 동기화) — P</option>
          </select>
        </div>
        <div style="width:130px">
          <label>발급 수량</label>
          <input id="count" type="number" value="10" min="1" max="500" />
        </div>
      </div>
      <label>메모 (주문번호 등, 출력 파일에 함께 저장)</label>
      <input id="memo" type="text" placeholder="예) WooCommerce #1043" />
      <div class="row" style="margin-top:12px">
        <button id="gen">키 발급</button>
        <button class="ghost" id="copy">전체 복사</button>
        <button class="ghost" id="csv">CSV 저장</button>
      </div>
      <label>발급된 키</label>
      <textarea id="out" class="keys" readonly></textarea>
    </div>

    <div class="card">
      <label>키 검증 (고객 문의 대응용)</label>
      <input id="verifyInput" placeholder="XXXX-XXXX-XXXX" />
      <p id="verifyOut" class="muted">키를 입력하면 유효성과 플랜을 확인합니다.</p>
    </div>
  </div>

  <script type="module">
    import { generateKey, verifyKey, formatKey, PRODUCTS } from '../src/core/license.js'

    const $ = (id) => document.getElementById(id)
    let keys = []

    $('gen').onclick = () => {
      const plan = $('plan').value
      const product = $('product').value
      const n = Math.max(1, Math.min(500, Number($('count').value) || 1))
      const seen = new Set()
      keys = []
      while (keys.length < n) {
        const k = generateKey(plan, product)
        if (seen.has(k)) continue
        seen.add(k)
        keys.push(k)
      }
      $('out').value = keys.join('\n')
    }

    $('copy').onclick = async () => {
      if (!keys.length) return
      await navigator.clipboard.writeText(keys.join('\n'))
      $('copy').textContent = '복사됨!'
      setTimeout(() => ($('copy').textContent = '전체 복사'), 1500)
    }

    $('csv').onclick = () => {
      if (!keys.length) return
      const memo = $('memo').value.replaceAll('"', "'")
      const plan = $('plan').value
      const product = $('product').value
      const today = new Date().toISOString().slice(0, 10)
      const csv = ['key,product,plan,issued_at,memo',
        ...keys.map((k) => `${k},${product},${plan},${today},"${memo}"`)].join('\n')
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = `license_${product}${plan === 'pro' ? 'P' : 'L'}_${today}.csv`
      a.click()
    }

    $('verifyInput').oninput = (e) => {
      const v = e.target.value.trim()
      const out = $('verifyOut')
      if (!v) { out.textContent = '키를 입력하면 유효성과 플랜을 확인합니다.'; out.className = 'muted'; return }
      const r = verifyKey(v, { productCode: 'M' }).ok ? verifyKey(v, { productCode: 'M' }) : verifyKey(v, { productCode: 'K' })
      out.textContent = r.ok
        ? `유효한 키 · ${PRODUCTS[r.product]?.label || '통합'} · ${r.plan.toUpperCase()} · v${r.version} · 표기 ${formatKey(v)}`
        : `사용할 수 없는 키: ${r.reason}`
      out.className = r.ok ? 'ok' : 'bad'
    }
  </script>
</body>
</html>
