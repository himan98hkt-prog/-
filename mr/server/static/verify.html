<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화성 확인</title>
<link rel="stylesheet" href="player/tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ctext y=%2226%22 font-size=%2226%22%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
</head>
<body>
<header>
  <a href="index.html">← 목록</a>
  <h1 id="title">…</h1>
  <span class="sub" id="meta"></span>
  <span class="spacer"></span>
  <span class="sub">검수 <b id="timer">0:00</b></span>
  <button id="save">저장</button>
  <button id="done" class="primary">확인 완료</button>
</header>
<main>
  <div class="toolbar">
    <button id="play" class="big">▶ 전체 재생</button>
    <button id="stop">■ 정지</button>
    <label>편성</label><select id="style"></select>
    <label>두께</label><select id="level"></select>
    <label>♩=</label><select id="bpm"></select>
    <label>듣기</label><select id="mix"></select>
    <span class="spacer"></span>
    <button id="export">⤓ 내보내기</button>
    <button id="reanalyze">다시 분석</button>
  </div>

  <!-- 내보내기. 화면 위쪽의 편성·두께·템포·듣기를 그대로 쓴다 — 여기서 또
       고르게 하면 「화면에서 듣던 것과 받은 파일이 다르다」가 생긴다. -->
  <section class="export" id="exportPanel" hidden>
    <div class="export__head">
      <b>무엇으로 받으시겠습니까</b>
      <span class="export__now" id="exportNow"></span>
    </div>
    <div class="export__warn" id="exportWarn" hidden></div>
    <div class="export__picks" id="exportPicks"></div>
    <label class="export__stems">
      <input type="checkbox" id="exportStems"> 파트별로 나눠서 받기
      <span class="tiny">— 영상 편집할 때 악기별로 볼륨을 따로 만지시려면</span>
    </label>
    <div class="export__go">
      <button class="primary big" id="exportGo">받기</button>
      <span class="export__say" id="exportSay"></span>
    </div>
  </section>
  <div class="status" id="status"></div>
  <div class="legend">
    <span><i class="swatch low"></i>확인 필요 — 2위 후보와 점수 차가 작은 구간</span>
    <span><i class="swatch changed"></i>사람이 고친 칸</span>
    <span>칸을 바꾸면 반주가 다시 만들어집니다 (약 2초)</span>
  </div>
  <div class="bars" id="bars"></div>
</main>
<audio id="audio" preload="none"></audio>
<script src="verify.js"></script>
</body>
</html>
