<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화성 확인</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <a href="index.html">← 목록</a>
  <h1 id="title">…</h1>
  <span class="sub" id="meta"></span>
  <span class="spacer"></span>
  <span class="sub">검수 <b id="timer">0:00</b></span>
  <button id="save">저장</button>
  <button id="done" class="primary">확인 완료</button>
</header>
<main>
  <div class="toolbar">
    <button id="play" class="big">▶ 전체 재생</button>
    <button id="stop">■ 정지</button>
    <label>편성</label><select id="style"></select>
    <label>두께</label><select id="level"></select>
    <label>♩=</label><select id="bpm"></select>
    <label>듣기</label><select id="mix"></select>
    <span class="spacer"></span>
    <button id="reanalyze">다시 분석</button>
  </div>
  <div class="status" id="status"></div>
  <div class="legend">
    <span><i class="swatch low"></i>확인 필요 — 2위 후보와 점수 차가 작은 구간</span>
    <span><i class="swatch changed"></i>사람이 고친 칸</span>
    <span>칸을 바꾸면 반주가 다시 만들어집니다 (약 2초)</span>
  </div>
  <div class="bars" id="bars"></div>
</main>
<audio id="audio" preload="none"></audio>
<script src="verify.js"></script>
</body>
</html>
