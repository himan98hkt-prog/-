[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshorts-engine"
version = "0.1.0"
description = "롱폼 영상을 AI 로 분석해 자막이 합성된 9:16 쇼츠를 자동 생성하는 로컬 파이프라인"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["shorts", "video", "whisper", "gemini", "ffmpeg", "yt-dlp"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
  "yt-dlp>=2024.8.6",
  "faster-whisper>=1.0.3",
  "google-genai>=1.0.0",
]

[project.optional-dependencies]
# 업로드는 OAuth 2.0 인증이 필요해 공식 클라이언트를 쓴다.
upload = ["google-api-python-client>=2.100.0", "google-auth-oauthlib>=1.2.0"]
ui = ["gradio>=4.44"]
dev = ["pytest>=8.0", "python-dotenv>=1.0", "ruff>=0.6"]
all = [
  "google-api-python-client>=2.100.0",
  "google-auth-oauthlib>=1.2.0",
  "gradio>=4.44",
]

[project.scripts]
autoshorts = "autoshorts.cli:main"

[tool.setuptools]
packages = ["autoshorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ── 최소 품질 gate (Phase 0) ─────────────────────────────────
# 의도적으로 좁게 시작한다. 기존 코드 스타일을 대규모로 뜯어고치는 규칙은 켜지 않고,
# **실제 버그가 되는 것만** 막는다.
#   F  — pyflakes: 미사용/미정의 이름, 잘못된 f-string, 중복 정의 등
#   E9 — 구문 오류, 파싱 실패
# E501(줄 길이)·E741(모호한 변수명)·E731(람다 대입)은 지금 코드에 다수 존재하고
# 동작과 무관하므로 켜지 않았다. 손볼 때 함께 정리한 뒤 켜는 것을 권한다.
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
