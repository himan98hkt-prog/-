# ══════════════════════════════════════════════════════════════════════
#  원리한입 — LTX 로 매일 아침 9시 자동 제작·업로드
#
#  기존 채널(config.yaml)과 **완전히 분리**돼 돈다.
#  산출물 runs-wonri/ · 시드 seeds-wonri/ · 예약 이름 · 비용 누계가 모두 따로다.
#
#  켜는 법:
#    python main.py doctor --config config.wonri.yaml
#    python -m publish.scheduler --config config.wonri.yaml --at 09:00 --youtube
#  예약(윈도우): 작업실 화면 [3 · 자동 업로드] 또는
#    python main.py schedule on --config config.wonri.yaml
# ══════════════════════════════════════════════════════════════════════

channel:
  slug: wonri
  name: 원리한입
  publish_at: "09:00"       # 아침 9시 게시. 예약은 08:30 에 시작한다.
  runs_dir: runs-wonri
  seeds_dir: seeds-wonri

# 한 클립으로 끝낸다. LTX-2 는 한 번에 20초까지 만들어 주므로 체이닝할
# 이유가 없다. 체이닝은 마지막 프레임을 다시 넣는 과정에서 화면이 서서히
# 무너지는데, 그 위험을 질 필요가 없다.
mode: chain

# ── provider ─────────────────────────────────────────────────────────
provider: fal
model: ltx2_fast_1080

# 20초 한 클립 = $0.80. 매일 한 편이면 한 달 약 $24.
#
# LTX 계열은 6초부터 **2초 단위**로만 받는다. 19 나 15 로 적으면 실행되지
# 않고, 설정을 읽는 시점에 막힌다 (fal 에 접수되기 전이라 과금은 없다).
clip_duration: 20
num_clips: 1

# ── 프롬프트 ─────────────────────────────────────────────────────────
# 시드마다 사이드카(seeds-wonri/<이름>.yaml)에 prompt 를 적으면 그것이
# 우선한다. 여기 값은 사이드카가 없을 때 쓰는 기본값이다.
motion_prompt: >-
  slow cinematic push-in on the subject, gentle parallax, steady camera,
  soft natural light, clean uncluttered background, no scene cut
negative_prompt: >-
  scene change, camera cut, text, watermark, distorted geometry,
  morphing shapes, flickering, jittery motion

scene_prompts: []

# 클립이 하나라 클립 사이 보정이 필요 없다. 호출 한 번을 아낀다.
upscale_between_clips: false
upscaler: esrgan

# ── 합성 ─────────────────────────────────────────────────────────────
crossfade_seconds: 0.3
montage_transition: cut
montage_transition_seconds: 0.25
loop_back: false            # LTX-2 는 끝 이미지를 받지 않는다

output:
  width: 1080
  height: 1920
  fps: auto
  crf: 18

  # LTX-2 는 소리를 함께 만든다. 그래서 여기서 음악을 고르지 않는다 —
  # 덧씌우면 두 소리가 겹친다. 파이프라인이 모델 소리를 그대로 살린다.
  audio: auto
  audio_file: ""
  music_dir: music

  # 설명형 채널은 첫 문장이 곧 후킹이다. 앞 2.4초에 큰 글씨로 굽는다.
  # ffmpeg 으로 처리하므로 비용이 0 이다.
  hook_overlay:
    enabled: true
    seconds: 2.4
    font: ""
    font_size: 0

  # LTX-2 는 그림에 맞춰 소리를 만든다. 무한 루프 잇기는 **영상만** 재배열해
  # (마지막 몇 초를 앞으로 옮겨 겹친다) 소리가 그만큼 어긋난다 — 말소리면
  # 문장이 중간부터 시작한다. 그래서 이 채널에서는 끈다.
  # 켜 두어도 파이프라인이 건너뛰고 이유를 알려준다.
  seamless_loop:
    enabled: false
    seconds: 0.6

  look:
    grade: none
    logo: ""
    logo_height: 72
    logo_margin: 40
    logo_opacity: 0.55

# 본편 전에 싸게 시험할 때. 6초는 LTX-2 의 하한이다.
preview:
  model: ltx2_fast_1080
  clip_duration: 6
  upscale: false

poll_timeout_seconds: 1800

# ── 비용 가드레일 ────────────────────────────────────────────────────
# 채널마다 따로 센다 (누계가 runs-wonri/ 에 쌓인다).
cost:
  retry_multiplier: 1.8
  hard_cap_usd: 5.0         # 편당 $0.80 이므로 1회 실행이 이걸 넘을 일이 없다
  monthly_cap_usd: 35.0     # 매일 1편 = 약 $24. 재시도 여유를 둔 값.

# 단가·엔드포인트는 config.yaml 의 providers 블록과 같은 것을 쓴다.
# (이 파일에도 있어야 로드되므로 필요한 것만 다시 적는다)
providers:
  fal:
    endpoint_base: https://queue.fal.run
    models:
      # [확인 필요] fal.ai 공식 페이지를 직접 열지 못한 상태에서 정리한 값이다.
      # 첫 실행에서 HTTP 422 가 뜨면 endpoint 와 extra_params 를 대조할 것.
      ltx2_fast_1080:
        endpoint: fal-ai/ltx-2/image-to-video/fast
        price_per_second: 0.04
        min_duration: 6
        max_duration: 20
        duration_step: 2
        supports_end_image: false
        supports_negative: true
        has_native_audio: true
        extra_params:
          resolution: "1080p"
      ltx2_pro_1080:
        endpoint: fal-ai/ltx-2/image-to-video
        price_per_second: 0.06
        min_duration: 6
        max_duration: 10
        duration_step: 2
        supports_end_image: false
        supports_negative: true
        has_native_audio: true
        extra_params:
          resolution: "1080p"
      ltxv_13b_distilled:
        endpoint: fal-ai/ltxv-13b-098-distilled/image-to-video
        price_per_second: 0.02
        min_duration: 2
        max_duration: 10
        duration_step: 1
        duration_param: num_frames
        frames_per_second: 24
        supports_end_image: false
        supports_negative: true
    upscalers:
      esrgan:
        endpoint: fal-ai/esrgan
        price_per_image: 0.01

# ══════════════════════════════════════════════════════════════════════
#  업로드
# ══════════════════════════════════════════════════════════════════════
publish:
  youtube:
    # 처음에는 비공개로 올려 눈으로 확인한 뒤 공개로 바꾸는 흐름을 권한다.
    # 무인 실행이 바로 공개로 나가면 잘못 만들어진 편을 되돌릴 수 없다.
    enabled: false
    privacy: private
    category_id: "27"        # 27 = Education
    title_template: "{title} | 원리한입 #Shorts"
    description_template: |
      {description}

      하루 한 입, 원리 하나.

      ▶ 매일 아침 9시 업로드

      #Shorts #원리한입 #지식 #교양 #상식 #shortsfeed
    tags: [shorts, 원리한입, 지식, 교양, 상식, 과학, 원리, 설명]
    daily_upload_cap: 90

  storage:
    enabled: true
    bucket: ""
    region: ""
    endpoint_url: ""
    prefix: wonri
    url_strategy: presigned
    public_base_url: ""
    expiry_seconds: 3600
    acl: ""
    delete_after_publish: true
    multipart_threshold_mb: 100

  instagram:
    enabled: false
    caption_template: |
      {description}

      하루 한 입, 원리 하나 🍽
      매일 아침 9시

      #릴스 #원리한입 #지식 #교양 #상식
      #reels #shorts #knowledge
    share_to_feed: true
    daily_upload_cap: 45
