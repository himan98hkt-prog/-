[package]
name = "homepilot-agent"
description = "HomePilot Remote - Windows PC 에이전트"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "homepilot_agent"
path = "src/lib.rs"

[[bin]]
name = "homepilot-agent"
path = "src/main.rs"

[[bin]]
name = "homepilot-cli"
path = "src/bin/homepilot-cli.rs"

[dependencies]
homepilot-protocol = { path = "../shared/protocol" }
homepilot-relay = { path = "../server" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
base64.workspace = true
rand.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing-appender = "0.2"
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
jpeg-encoder = "0.6"
dirs = "5"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_Security_Cryptography",
] }

[target.'cfg(windows)'.build-dependencies]
