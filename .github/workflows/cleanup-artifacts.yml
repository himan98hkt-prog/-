name: 빌드 결과물 정리

# 쌓인 Actions 빌드 결과물(설치본·APK 등)을 이름으로 골라 지운다.
# - 이 파일을 고쳐 push 하면 아래 기본값으로 한 번 돈다
# - 기본 브랜치에 들어간 뒤에는 Actions 탭에서 이름·남길 개수를 넣고 직접 돌릴 수 있다
on:
  push:
    branches: [claude/relaxed-fermat-tn83x0]
    paths: [.github/workflows/cleanup-artifacts.yml]
  workflow_dispatch:
    inputs:
      names:
        description: 지울 결과물 이름 (쉼표로 구분)
        required: true
      keep_latest:
        description: 이름마다 남길 최신본 개수
        required: true
        default: '0'

permissions:
  actions: write

jobs:
  cleanup:
    name: 결과물 지우기
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        env:
          NAMES: ${{ inputs.names || '피아노이벤트-설치본-mac,피아노이벤트-설치본-windows' }}
          KEEP: ${{ inputs.keep_latest || '0' }}
        with:
          script: |
            const names = new Set(process.env.NAMES.split(',').map(s => s.trim()).filter(Boolean));
            const keep = Number(process.env.KEEP) || 0;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            let count = 0, bytes = 0;
            for (const name of names) {
              const hits = all
                .filter(a => a.name === name)
                .sort((a, b) => b.created_at.localeCompare(a.created_at))
                .slice(keep);
              for (const a of hits) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id,
                });
                count++; bytes += a.size_in_bytes;
              }
              core.info(`${name}: ${hits.length}개 삭제`);
            }
            core.notice(`총 ${count}개, ${(bytes / 1048576).toFixed(0)} MB 삭제`);
