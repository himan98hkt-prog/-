# 설치본 만들기 — 윈도우 설치 프로그램(.exe)과 맥 dmg
#
# 윈도우용 설치 프로그램은 **윈도우에서** 만들어야 제대로 나온다(리눅스에서 흉내 낼 수는
# 있지만 서명·아이콘·바로가기에서 어긋난다). 그래서 만드는 일을 여기에 맡긴다.
#
#   깃허브 → Actions → "설치본 만들기" → Run workflow
#   끝나면 Releases 의 `installer-latest` 에서 내려받으시면 됩니다.
name: PianoEvent 설치본 만들기

on:
  # 손으로 눌러 만들기 (기본 브랜치에 들어간 뒤부터 눌립니다)
  workflow_dispatch:
  # 판올림 표를 붙이면 만들기
  push:
    tags: ['pianoevent-v*']
    # 아직 기본 브랜치에 안 들어간 동안에도 설치본을 받아 보실 수 있게
    branches: ['claude/piano-event-program-**']
    paths:
      - 'pianoevent-ai/desktop/**'
      - 'pianoevent-ai/electron-builder.yml'
      - 'pianoevent-ai/scripts/build-desktop.mjs'
      - '.github/workflows/pianoevent-installer.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # 두 일감이 같은 판올림 표(installer-latest)에 올린다.
      # 동시에 올리면 한쪽이 밀린다 — 한 번에 하나씩.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: win
            name: windows
            ext: exe
          - os: macos-latest
            target: mac
            name: mac
            ext: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pianoevent-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pianoevent-ai/package-lock.json

      - name: 꾸러미 받기
        run: npm ci

      - name: 프로그램 본체 만들기
        run: npm run desktop

      # 본체가 온전한지 먼저 본다 — 빠진 채로 설치본을 뽑으면 원장님 컴퓨터에서야 안다
      - name: 본체 확인
        shell: bash
        run: |
          for f in server.js node_modules .next/static public/manual docs/MANUAL.md; do
            test -e "desktop/app/$f" || { echo "✗ $f 가 빠졌습니다"; exit 1; }
          done
          echo "본체 확인 완료"

      - name: 설치본 뽑기
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: 피아노이벤트-설치본-${{ matrix.name }}
          path: pianoevent-ai/배포/설치본/*.${{ matrix.ext }}
          if-no-files-found: error

      # Actions 의 첨부물은 로그인해야 받을 수 있고 90일이면 사라진다.
      # 원장님께 건네 드릴 것은 **누구나 바로 받는 주소**라야 한다 — 릴리스로 올린다.
      - name: 내려받는 자리에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          name: 피아노이벤트 설치 프로그램
          body: |
            피아노학원 연주회 준비 프로그램 — 설치해서 쓰는 판입니다.

            · 윈도우 — **PianoEvent-Setup-Windows.exe** 를 받아 두 번 클릭하고 다음 · 다음 · 설치
            · 맥 — **PianoEvent-Mac.dmg** 를 열고 응용 프로그램 폴더로 끌어다 놓기

            설치하면 바탕화면에 아이콘이 생깁니다. 검은 명령창도, 인터넷도 필요 없습니다.
            「Windows의 PC 보호」 파란 창이 뜨면 **추가 정보 → 실행** 을 누르세요.
          files: pianoevent-ai/배포/설치본/*.${{ matrix.ext }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 옛 이름으로 올라간 것이 옆에 남아 있으면 무엇을 눌러야 할지 망설이시게 된다
      - name: 옛 이름의 첨부물 치우기
        run: node scripts/clean-release-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
