# 설치본 만들기 — 윈도우 설치 프로그램(.exe)과 맥 dmg
#
# 윈도우용 설치 프로그램은 **윈도우에서** 만들어야 제대로 나온다(리눅스에서 흉내 낼 수는
# 있지만 서명·아이콘·바로가기에서 어긋난다). 그래서 만드는 일을 여기에 맡긴다.
#
#   깃허브 → Actions → "설치본 만들기" → Run workflow
#   끝나면 Releases 의 `installer-latest` 에서 내려받으시면 됩니다.
name: 연주회 매니저 설치본 만들기

on:
  # 손으로 눌러 만들기 (기본 브랜치에 들어간 뒤부터 눌립니다)
  workflow_dispatch:
  # 판올림 표를 붙이면 만들기
  push:
    tags: ['pianoevent-v*']
    # 아직 기본 브랜치에 안 들어간 동안에도 설치본을 받아 보실 수 있게
    branches: ['claude/piano-event-program-**']
    # 껍데기뿐 아니라 **프로그램이 바뀔 때마다** 다시 만든다.
    # 받는 자리에 놓인 것이 지금 프로그램과 다르면, 원장님은 고쳐지지 않은 판을 쓰시게 된다.
    paths:
      - 'pianoevent-ai/**'
      - '.github/workflows/pianoevent-installer.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # 두 일감이 같은 판올림 표(installer-latest)에 올린다.
      # 동시에 올리면 한쪽이 밀린다 — 한 번에 하나씩.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: win
            name: windows
            ext: exe
          - os: macos-latest
            target: mac
            name: mac
            ext: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pianoevent-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pianoevent-ai/package-lock.json

      - name: 꾸러미 받기
        run: npm ci

      - name: 프로그램 본체 만들기
        run: npm run desktop
        env:
          # 인증키를 확인할 때 쓰는 비밀. 저장소에 두지 않는다 — 여기 있으면
          # 저장소를 보는 누구나 키를 찍어 낼 수 있다.
          # 없으면 개발용 비밀로 뽑히고, 그 판은 **파실 키를 열지 못한다.**
          RECITAL_LICENSE_SECRET: ${{ secrets.RECITAL_LICENSE_SECRET }}

      # 본체가 온전한지 먼저 본다 — 빠진 채로 설치본을 뽑으면 원장님 컴퓨터에서야 안다
      - name: 본체 확인
        shell: bash
        run: |
          for f in server.js node_modules .next/static public/manual docs/MANUAL.md; do
            test -e "desktop/app/$f" || { echo "✗ $f 가 빠졌습니다"; exit 1; }
          done
          echo "본체 확인 완료"

      # 서명서가 저장소 비밀(Secrets)에 들어 있으면 **서명해서** 뽑는다.
      #
      # 서명이 없으면 설치할 때 「Windows의 PC 보호」 파란 창이 뜬다. 원장님은 그 창에서
      # 「이건 이상한 프로그램인가」 하고 멈추신다 — 돈 받고 파는 물건에서 이게 가장 아깝다.
      # 서명서를 넣으시는 방법은 docs/SIGNING.md 에 적어 두었다.
      #
      # 없으면 지금까지와 똑같이(서명 없이) 뽑는다 — 넣기 전에도 설치본은 계속 나온다.
      - name: 서명서 준비 (있을 때만)
        shell: bash
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          MAC_CERT: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          cert=""
          pass=""
          if [ "${{ matrix.target }}" = "win" ]; then cert="$WIN_CERT"; pass="$WIN_CERT_PASSWORD"; fi
          if [ "${{ matrix.target }}" = "mac" ]; then cert="$MAC_CERT"; pass="$MAC_CERT_PASSWORD"; fi
          if [ -n "$cert" ]; then
            printf 'CSC_LINK=%s\n' "$cert" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "$pass" >> "$GITHUB_ENV"
            echo "서명서가 있습니다 — 서명해서 뽑습니다"
          else
            echo "서명서가 없습니다 — 서명 없이 뽑습니다 (지금까지와 같습니다)"
          fi

      - name: 설치본 뽑기
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 맥은 서명만으로는 모자라고 애플에 공증(notarize)까지 받아야 경고가 사라진다.
          # 셋이 다 들어 있을 때만 electron-builder 가 공증을 시도한다.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: 연주회매니저-설치본-${{ matrix.name }}
          path: pianoevent-ai/배포/설치본/*.${{ matrix.ext }}
          if-no-files-found: error

      # Actions 의 첨부물은 로그인해야 받을 수 있고 90일이면 사라진다.
      # 원장님께 건네 드릴 것은 **누구나 바로 받는 주소**라야 한다 — 릴리스로 올린다.
      - name: 내려받는 자리에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          name: 연주회 매니저 설치 프로그램
          body: |
            피아노학원 연주회 준비 프로그램 **연주회 매니저** — 설치해서 쓰는 판입니다. (아첼쌤)

            · 윈도우 — **RecitalManager-Setup-Windows.exe** 를 받아 두 번 클릭하고 다음 · 다음 · 설치
            · 맥 — **RecitalManager-Mac.dmg** 를 열고 응용 프로그램 폴더로 끌어다 놓기

            설치하면 바탕화면에 아이콘이 생깁니다. 검은 명령창도, 인터넷도 필요 없습니다.
            「Windows의 PC 보호」 파란 창이 뜨면 **추가 정보 → 실행** 을 누르세요.
            (서명서를 넣으면 이 창이 사라집니다 — docs/SIGNING.md)
          files: pianoevent-ai/배포/설치본/*.${{ matrix.ext }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 옛 이름으로 올라간 것이 옆에 남아 있으면 무엇을 눌러야 할지 망설이시게 된다
      - name: 옛 이름의 첨부물 치우기
        run: node scripts/clean-release-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
