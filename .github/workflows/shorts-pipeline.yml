name: shorts-pipeline CI

# 파이썬 파이프라인은 학원 관리노트(JS)와 독립이라 해당 경로가 바뀔 때만 돈다
on:
  push:
    branches: [main]
    paths: ['shorts-pipeline/**', '.github/workflows/shorts-pipeline.yml']
  pull_request:
    paths: ['shorts-pipeline/**', '.github/workflows/shorts-pipeline.yml']
  workflow_dispatch:

concurrency:
  group: shorts-pipeline-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: shorts-pipeline

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: shorts-pipeline/requirements.txt

      # 이 검사들은 ffmpeg 로 진짜 mp4 를 만들어 돌린다. 클립 길이·프레임률·
      # 오디오 트랙 유무를 실제 파일에서 재기 때문에, 흉내로는 잡히지 않는
      # 결함(모델 소리가 무음으로 덮이는 것 등)이 여기서 걸린다.
      - name: ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 의존성 설치
        run: pip install -r requirements.txt pytest

      # API 키는 넣지 않는다. 검사는 가짜 provider 로만 돌아야 한다 —
      # 키가 있어야 통과하는 검사가 섞이면 그 사실을 여기서 알게 된다.
      - name: 테스트
        run: python -m pytest -q
