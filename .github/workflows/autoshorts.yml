name: AutoShorts CI

# 파이썬 파이프라인은 학원 관리노트(JS)와 독립이라 해당 경로가 바뀔 때만 돈다
on:
  push:
    branches: [main, codex/shorts-studio-integration]
    paths: ['autoshorts-engine/**', '.github/workflows/autoshorts.yml']
  pull_request:
    paths: ['autoshorts-engine/**', '.github/workflows/autoshorts.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoshorts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: autoshorts-engine

jobs:
  preview:
    name: Local Docker preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and start preview
        run: docker compose -f compose.preview.yml up --build -d
      - name: Check API and console
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:8765/health
          curl --fail http://127.0.0.1:8765/ | grep 'id="downloads"'
      - name: Save container logs
        if: always()
        run: docker compose -f compose.preview.yml logs --no-color > preview-containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-container-logs
          path: autoshorts-engine/preview-containers.log
          retention-days: 7
      - name: Stop disposable preview
        if: always()
        run: docker compose -f compose.preview.yml down -v
  postgres:
    name: SaaS PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoshorts_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: autoshorts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoshorts_test -d autoshorts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable service only. Never use repository or production DB secrets.
      AUTOSHORTS_TEST_DATABASE_URL: postgresql://autoshorts_test:disposable_ci_password@127.0.0.1:5432/autoshorts_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest fastapi uvicorn httpx 'psycopg[binary]>=3.1' python-multipart python-dotenv google-auth
      - name: Verify disposable database connection
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['AUTOSHORTS_TEST_DATABASE_URL']) as conn:
              assert conn.execute('SELECT current_database()').fetchone()[0] == 'autoshorts_test'
          PY
      - name: Test SaaS and storage boundaries
        run: python -m pytest -o addopts='' -q tests/test_saas_*.py tests/test_storage_boundary.py --junitxml=postgres-results.xml
      - name: Reject skipped database coverage
        if: success()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('postgres-results.xml').getroot()
          cases = root.findall('.//testcase')
          assert cases, 'No test cases collected'
          skipped = [case.get('name') for case in cases if case.find('skipped') is not None]
          assert not skipped, f'Skipped integration tests: {skipped}'
          print(f'Validated {len(cases)} test cases with no skips')
          PY
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-nanum
      - name: Real FFmpeg through separate API and worker processes
        run: python -m scripts.smoke_saas_processes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-results
          path: |
            autoshorts-engine/postgres-results.xml
            autoshorts-engine/process-smoke-evidence/
          retention-days: 7

  test:
    name: 테스트 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 테스트는 무거운 의존성(yt-dlp·faster-whisper·Gemini SDK) 없이 통과해야 한다.
      # 지연 임포트가 깨지면 여기서 잡힌다.
      - name: 테스트 도구만 설치
        run: pip install pytest

      - name: 단위·통합 테스트
        run: python -m pytest -q

      - name: 패키지 설치 확인
        run: |
          pip install -e . --no-deps
          autoshorts --version
          autoshorts --help > /dev/null
