name: AutoShorts CI

# 파이썬 파이프라인은 학원 관리노트(JS)와 독립이라 해당 경로가 바뀔 때만 돈다
on:
  push:
    branches: [main]
    paths: ['autoshorts-engine/**', '.github/workflows/autoshorts.yml']
  pull_request:
    paths: ['autoshorts-engine/**', '.github/workflows/autoshorts.yml']
  workflow_dispatch:

concurrency:
  group: autoshorts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: autoshorts-engine

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 테스트는 무거운 의존성(yt-dlp·faster-whisper·Gemini SDK) 없이 통과해야 한다.
      # 지연 임포트가 깨지면 여기서 잡힌다.
      - name: 테스트 도구만 설치
        run: pip install pytest

      - name: 단위·통합 테스트
        run: python -m pytest -q

      - name: 패키지 설치 확인
        run: |
          pip install -e . --no-deps
          autoshorts --version
          autoshorts --help > /dev/null
