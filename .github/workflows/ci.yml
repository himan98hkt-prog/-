name: CI

on:
  # push 는 main 만 — 기능 브랜치는 pull_request 트리거가 이미 검사하므로
  # 둘 다 켜면 같은 커밋이 두 번 돈다
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 단위·통합 테스트
        run: npm test

      - name: 프로덕션 빌드
        run: npm run build

      - name: 배포 산출물 확인
        run: |
          # 판매 대상 3종(Pro·Lite·키 발급기)이 모두 나왔는지
          for f in dist/index.html dist/lite.html dist/tools/keygen.html; do
            test -f "$f" || { echo "::error::$f 가 생성되지 않았습니다"; exit 1; }
          done
          echo "산출물 크기:"
          du -sh dist

      - name: 빌드 산출물 업로드
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  mr:
    name: 반주 엔진 · 회귀 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mr
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mr/requirements.txt

      - name: 파이썬 의존성
        run: pip install -r requirements.txt

      - name: 렌더링 도구 (지시서 부록 A)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fluidsynth ffmpeg fluid-soundfont-gm

      - name: 테스트
        run: python3 -m pytest

      - name: 화성 정확도 게이트 (95% 미만이면 실패)
        run: python3 bench.py --stages
