name: CI

on:
  # push 는 main 만 — 기능 브랜치는 pull_request 트리거가 이미 검사하므로
  # 둘 다 켜면 같은 커밋이 두 번 돈다
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 단위·통합 테스트
        run: npm test

      - name: 프로덕션 빌드
        run: npm run build

      - name: 배포 산출물 확인
        run: |
          # 판매 대상 3종(Pro·Lite·키 발급기)이 모두 나왔는지
          for f in dist/index.html dist/lite.html dist/tools/keygen.html; do
            test -f "$f" || { echo "::error::$f 가 생성되지 않았습니다"; exit 1; }
          done
          echo "산출물 크기:"
          du -sh dist

      - name: 빌드 산출물 업로드
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  mr:
    name: 반주 엔진 · 회귀 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mr
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mr/requirements.txt

      - name: 파이썬 의존성
        run: pip install -r requirements.txt

      - name: 렌더링 도구 (지시서 부록 A)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fluidsynth ffmpeg fluid-soundfont-gm

      - name: 테스트
        run: python3 -m pytest

      - name: 화성 정확도 게이트 (95% 미만이면 실패)
        run: python3 bench.py --stages

      - name: 카탈로그 파이프라인 (들이기 → 분석 → 검수 → 내보내기)
        run: |
          python3 seed_catalog.py --catalog /tmp/ci-catalog
          python3 catalog_cli.py --catalog /tmp/ci-catalog status
          python3 catalog_cli.py --catalog /tmp/ci-catalog build --all \
              --styles strings,march --levels normal
          python3 catalog_cli.py --catalog /tmp/ci-catalog export /tmp/player.json

      - name: 무대 장면이 파일 없이도 자급자족하는지 (지시서 ⑤-1 오프라인)
        run: |
          python3 -c "
          import os
          for f in ('server/static/hall.css', 'server/static/program.html',
                    'server/static/program.js'):
              assert os.path.getsize(f) > 500, f
          html = open('server/static/program.html', encoding='utf-8').read()
          assert '<svg class=\"piano\"' in html, '무대 피아노 SVG 가 없습니다'
          css = open('server/static/hall.css', encoding='utf-8').read()
          for sel in ('.stage__paint', '.beam', '.mote'):
              assert sel in css, f'무대 장면 {sel} 가 없습니다'
          have = [n for n in ('hall.jpg', 'hall.mp4')
                  if os.path.exists(os.path.join('server/static/img', n))]
          print('무대 장면은 CSS·SVG 로 자급자족 OK'
                + (f' (배경 파일 {have} 도 함께 있음)' if have else ' (배경 파일 없음)'))
          "

      - name: 올린 PDF 를 서버가 들고 있지 않는지 (지시서 7장 · 4단계)
        run: |
          python3 -c "
          from piano_mr import store, omr
          import os
          st = store.CatalogStore('/tmp/ci-uploads')
          xml = open('fixtures/scores/p05_waltz_c.musicxml','rb').read()
          prov = omr.FakeProvider(musicxml=xml)
          blob = open('fixtures/pdf/three_pages.pdf','rb').read()
          j = st.submit_pdf(blob, 'a.pdf', account='CI학원', title='연습곡', provider=prov)
          assert os.listdir(st.incoming_dir) == [j['id'] + '.pdf'], '인식 중에는 격리 폴더에 있어야 합니다'
          j = st.poll_upload(j['id'], provider=prov)
          left = os.listdir(st.incoming_dir)
          assert left == [], f'MusicXML 이 왔는데 PDF 가 남아 있습니다: {left}'
          assert st.catalog.get(j['song_id']).owner == 'CI학원', '업로드본에 계정 표시가 없습니다'
          assert j['state'] == 'review', f'확인 화면을 건너뛰었습니다: {j[\"state\"]}'
          print('PDF 업로드 OK — 격리 폴더 비었고, 곡은 계정 전용이고, 확인 대기입니다')
          "

      - name: 플레이어 PWA — 브라우저에서 실제 재생·오프라인 (지시서 모듈 ⑤)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/player_check.py --catalog /tmp/ci-catalog

      - name: MR 에 원곡 피아노가 섞이지 않았는지 (채널 0 = 피아노)
        run: |
          python3 mr.py fixtures/scores/p07_minuet_g.musicxml \
              --mix mr -o /tmp/mr.mid --quiet
          python3 -c "
          from mido import MidiFile
          ch = {m.channel for t in MidiFile('/tmp/mr.mid').tracks
                for m in t if m.type == 'note_on'}
          assert ch, 'MR 이 비어 있습니다'
          assert 0 not in ch, f'MR 에 피아노(채널 0)가 들어 있습니다: {sorted(ch)}'
          print('MR 채널', sorted(ch), '— 피아노 없음 OK')
          "
