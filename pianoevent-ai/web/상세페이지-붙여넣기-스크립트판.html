<!-- ══════════════════════════════════════════════════════════════
     연주회 매니저 — 상세페이지 (다른 도메인에 넣으실 때만)

     accelssam.com 안에 넣으실 때는 `상세페이지-붙여넣기.html` 을 쓰세요.
     이 판은 상세페이지를 **다른 도메인**에 올려 두고 부르실 때만 필요합니다.
     그때는 상세페이지가 자기 틀을 직접 잡을 수 없어(브라우저가 막습니다)
     아래 스크립트가 높이를 대신 받아 줍니다.
     ══════════════════════════════════════════════════════════════ -->

<div id="recital-detail-box" style="max-width:1080px;margin:0 auto;padding:0 12px;box-sizing:border-box">
  <iframe id="recital-detail"
    src="https://accelssam.com/download/recital-manager-detail.html"
    title="연주회 매니저 상세페이지" scrolling="no"
    style="display:block;border:0;width:100%;height:11900px;
           border-radius:18px;overflow:hidden;
           box-shadow:0 10px 40px rgba(83,62,38,.10)"></iframe>
</div>

<script>
(function(){
  var f = document.getElementById('recital-detail');
  if(!f) return;
  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'accel-recital-height'){
      f.style.height = e.data.height + 'px';
    }
  });
  function nudge(){
    try{ f.contentWindow.postMessage({type:'accel-recital-measure'}, '*'); }catch(err){}
  }
  window.addEventListener('resize', nudge);
  f.addEventListener('load', nudge);
})();
</script>
